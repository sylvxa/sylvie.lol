{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="navbar">
    <a href="/">[ABOUT]</a>
    <a href="/blog" class="we-are-here">[BLOG]</a>
    <a href="/contact">[CONTACT]</a>
</div>
<div class="title">
    <a href="{{ url_for('blog_explore') }}" class="back">&lt;&lt; Back to all posts</a>
    <h1>{{ post.title }}</h1>
    <h3>{{ post.format_timestamp() }}</h3>
    <h3>{{ post.description }}</h3>
</div>
<div class="content">
    {{ post.markdown_content()|safe }}
</div>
{% endblock %}
