{% set page_title %}{% block title %}{% endblock %}{% endset %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">

    {% block meta %}
    <!-- These are by default, but individual pages will want to overwrite these -->
    <!-- Primary Meta Tags -->
    <meta name="title" content="{{ page_title }} - sylvie.lol" />
    <meta name="description" content="Full-stack developer and blåhaj enjoyer. :3" />
    <meta name="theme-color" content="#e2b27e">
    <meta name="keywords" content="sylvxa, sylvia, sylvie, programming, blog" />.

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sylvie.lol/" />
    <meta property="og:title" content="{{ page_title }} - sylvie.lol" />
    <meta property="og:description" content="Full-stack developer and blåhaj enjoyer. :3" />
    <meta property="og:image" content="https://sylvie.lol/static/assets/profile-128.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="https://sylvie.lol/" />
    <meta property="twitter:title" content="{{ page_title }} - sylvie.lol" />
    <meta property="twitter:description" content="Full-stack developer and blåhaj enjoyer. :3" />
    <meta property="twitter:image" content="https://sylvie.lol/static/assets/profile-128.png" />
    {% endblock %}

    {% block header %}{% endblock %}

    <script src="{{ url_for('static', filename='time.js') }}" defer></script>
    <style>
        @font-face {
            font-family: "VCR OSD Mono";
            src: url("{{ url_for('static', filename='assets/fonts/VCR-OSD-Mono.eot') }}") format("embedded-opentype"),
                url("{{ url_for('static', filename='assets/fonts/VCR-OSD-Mono.woff') }}") format("woff"),
                url("{{ url_for('static', filename='assets/fonts/VCR-OSD-Mono.woff2') }}") format("woff2"),
                url("{{ url_for('static', filename='assets/fonts/VCR-OSD-Mono.ttf') }}") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <title>{{ page_title }} - sylvie.lol</title>
</head>
<body>
    <div class="flex">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
